name: CI

on:
  push:
  pull_request:
    branches: [ master, main, dev ]
  schedule:
    # Weekly, so newly published vulnerabilities and toolchain problems
    # surface even when nothing is pushed.
    - cron: '23 5 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (${{ matrix.os }}, Go ${{ matrix.go-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, macos-latest, windows-latest ]
        go-version: [ '1.26.10', '1.27.3' ]

    steps:
    - name: Checkout repository
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - name: Set up Go
      uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      with:
        go-version: ${{ matrix.go-version }}
        check-latest: true

    - name: Verify dependencies
      run: go mod verify

    - name: Check formatting and module tidiness
      if: matrix.os == 'ubuntu-latest' && matrix.go-version == '1.27.3'
      shell: bash
      run: |
        unformatted="$(git ls-files -z '*.go' | xargs -0 gofmt -l)"
        test -z "${unformatted}"
        go mod tidy
        git diff --exit-code -- go.mod go.sum

    - name: Run go vet
      run: go vet ./...

    - name: Run static analysis
      if: matrix.os == 'ubuntu-latest' && matrix.go-version == '1.27.3'
      run: go run honnef.co/go/tools/cmd/staticcheck@v0.8.2 ./...

    - name: Run unit tests
      shell: bash
      run: |
        set +e
        test_output="$(go test -v ./... 2>&1)"
        test_status=$?
        printf '%s\n' "${test_output}"
        if [ "${test_status}" -ne 0 ]; then
          diagnostic="$(printf '%s' "${test_output}" | tail -c 8000)"
          diagnostic="${diagnostic//'%'/'%25'}"
          diagnostic="${diagnostic//$'\r'/'%0D'}"
          diagnostic="${diagnostic//$'\n'/'%0A'}"
          echo "::error title=Unit tests failed::${diagnostic}"
          exit "${test_status}"
        fi

    - name: Run unit tests as a 32-bit program
      # Release archives include 386 and 32-bit ARM builds.
      if: matrix.os == 'ubuntu-latest'
      env:
        GOARCH: '386'
        CGO_ENABLED: '0'
      run: go test -count=1 ./...

    - name: Run race detector
      if: matrix.os == 'ubuntu-latest' && matrix.go-version == '1.27.3'
      run: go test -race ./...

    - name: Scan reachable dependencies for vulnerabilities
      if: matrix.os == 'ubuntu-latest'
      run: go run golang.org/x/vuln/cmd/govulncheck@v1.7.0 ./...

  build:
    name: Cross-Platform Build
    runs-on: ubuntu-latest
    needs: test
    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: linux
            goarch: arm
            goarm: 7
          - goos: linux
            goarch: arm
            goarm: 6
          - goos: linux
            goarch: 386
          - goos: darwin
            goarch: amd64
          - goos: darwin
            goarch: arm64
          - goos: windows
            goarch: amd64
          - goos: windows
            goarch: arm64
          - goos: windows
            goarch: 386
          - goos: freebsd
            goarch: amd64
    steps:
    - name: Checkout repository
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - name: Set up Go
      uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      with:
        go-version: '1.27.3'

    - name: Build binary
      env:
        GOOS: ${{ matrix.goos }}
        GOARCH: ${{ matrix.goarch }}
        GOARM: ${{ matrix.goarm }}
        CGO_ENABLED: 0
      run: |
        OUTPUT="transmission-telegram-${{ matrix.goos }}-${{ matrix.goarch }}"
        if [ "${{ matrix.goos }}" = "windows" ]; then
          OUTPUT="${OUTPUT}.exe"
        fi
        go build -trimpath -v -o "${OUTPUT}" .

  transmission:
    name: Against Transmission ${{ matrix.transmission }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          # The last 4.0 release, and the newest, which deprecates the RPC
          # protocol the bot speaks but still serves it.
          - transmission: '4.0.6'
            image: docker.io/linuxserver/transmission:version-4.0.6-r6@sha256:452310cb020c036d293e879698097acb6cc653db2676610bf8e3b58a3f4d2af5
          - transmission: '4.1.3'
            image: docker.io/linuxserver/transmission:version-4.1.3-r0@sha256:55aaeedf9fc354d34136387e15ee0ba4679096f20398dd2875867e5cd5cf8be5
    services:
      transmission:
        image: ${{ matrix.image }}
        env:
          # A throwaway password, so that the bot's RPC authentication is
          # exercised too.
          USER: ci
          PASS: ci-only-password
        ports:
          - 9091:9091
    steps:
    - name: Checkout repository
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - name: Set up Go
      uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      with:
        go-version: '1.27.3'

    - name: Drive the bot against Transmission
      env:
        TT_TEST_TRANSMISSION_URL: http://localhost:9091/transmission/rpc
        TT_TEST_TRANSMISSION_AUTH: ci:ci-only-password
      run: go test -count=1 -v -run TestAgainstTransmission ./internal/bot/

  container:
    name: Container Build
    runs-on: ubuntu-latest
    needs: test
    timeout-minutes: 15
    steps:
    - name: Checkout repository
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - name: Build and inspect container
      shell: bash
      env:
        DOCKER_BUILDKIT: 1
      run: |
        docker build --build-arg VERSION=ci --tag transmission-telegram:ci .
        test "$(docker image inspect --format '{{.Config.User}}' transmission-telegram:ci)" = "1000:1000"
        test "$(docker image inspect --format '{{index .Config.Labels "org.opencontainers.image.version"}}' transmission-telegram:ci)" = "ci"
        docker run --rm --entrypoint /bin/sh transmission-telegram:ci -c \
          'test -s /etc/ssl/certs/ca-certificates.crt && test -d /config && test -w /config'
        startup_output="$(docker run --rm transmission-telegram:ci 2>&1 || true)"
        grep -F "telegram bot token is required" <<< "${startup_output}"

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

    - name: Build every platform the release publishes
      uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
      with:
        context: .
        platforms: linux/amd64,linux/arm64,linux/arm/v7,linux/arm/v6,linux/386
        build-args: VERSION=ci
        provenance: false
        push: false
