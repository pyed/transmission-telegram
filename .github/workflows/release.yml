name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  verify:
    name: Verify Release Candidate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.3'

      - name: Verify dependencies and generated module files
        shell: bash
        run: |
          go mod verify
          unformatted="$(git ls-files -z '*.go' | xargs -0 gofmt -l)"
          test -z "${unformatted}"
          go mod tidy
          git diff --exit-code -- go.mod go.sum

      - name: Run static analysis
        run: |
          go vet ./...
          go run honnef.co/go/tools/cmd/staticcheck@v0.8.1 ./...

      - name: Run tests with the race detector
        run: go test -race ./...

      - name: Scan reachable dependencies for vulnerabilities
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.7.0 ./...

  release:
    name: Build and Publish Release
    runs-on: ubuntu-latest
    needs: verify
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.3'
          check-latest: true

      - name: Take the release notes from the tag
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          # The checkout may hold the tag without its message, so fetch it
          # again. A lightweight tag has no notes of its own.
          git fetch --force origin "refs/tags/${TAG_NAME}:refs/tags/${TAG_NAME}"
          if [ "$(git cat-file -t "refs/tags/${TAG_NAME}")" = tag ]; then
            git tag --list --format='%(contents:body)' "${TAG_NAME}" > release-notes.md
          else
            : > release-notes.md
          fi

      - name: Build and Package Multi-Platform Binaries
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          mkdir -p dist
          
          PLATFORMS=(
            "linux/amd64"
            "linux/arm64"
            "linux/arm/7"
            "linux/arm/6"
            "linux/386"
            "darwin/amd64"
            "darwin/arm64"
            "windows/amd64"
            "windows/arm64"
            "windows/386"
            "freebsd/amd64"
          )
          
          for PLATFORM in "${PLATFORMS[@]}"; do
            IFS="/" read -r OS ARCH EXTRA <<< "${PLATFORM}"
            
            BIN_NAME="transmission-telegram"
            ARCHIVE_NAME="transmission-telegram_${TAG_NAME}_${OS}_${ARCH}"
            
            export GOOS=${OS}
            export GOARCH=${ARCH}
            export CGO_ENABLED=0
            
            if [ -n "${EXTRA}" ]; then
              export GOARM=${EXTRA}
              ARCHIVE_NAME="transmission-telegram_${TAG_NAME}_${OS}_${ARCH}v${EXTRA}"
            else
              unset GOARM
            fi
            
            BUILD_DIR="build_${OS}_${ARCH}${EXTRA}"
            mkdir -p "${BUILD_DIR}"
            
            TARGET_BIN="${BUILD_DIR}/${BIN_NAME}"
            if [ "${OS}" = "windows" ]; then
              TARGET_BIN="${TARGET_BIN}.exe"
            fi
            
            echo "Building ${OS}/${ARCH}${EXTRA}..."
            go build -trimpath -ldflags="-s -w -X github.com/pyed/transmission-telegram/v2/internal/config.Version=${TAG_NAME}" -o "${TARGET_BIN}" .
            
            cp README.md LICENSE "${BUILD_DIR}/"
            
            if [ "${OS}" = "windows" ]; then
              (cd "${BUILD_DIR}" && zip -r "../dist/${ARCHIVE_NAME}.zip" .)
            else
              tar -czf "dist/${ARCHIVE_NAME}.tar.gz" -C "${BUILD_DIR}" .
            fi
            
            rm -rf "${BUILD_DIR}"
          done
          
          # Generate SHA-256 Checksums
          cd dist
          sha256sum * > "checksums.txt"
          cd ..

      - name: Create GitHub Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          files: |
            dist/*.tar.gz
            dist/*.zip
            dist/checksums.txt
          # The annotated tag's message, then the pull requests merged since
          # the last release.
          body_path: release-notes.md
          generate_release_notes: true
          draft: false
          prerelease: false

  image:
    name: Publish Container Image
    runs-on: ubuntu-latest
    needs: release
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to the GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive image tags and labels
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository }}
          # 2.2.0, 2.2, v2.2.0, and latest for the newest release.
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=ref,event=tag

      - name: Build and push the multi-platform image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64,linux/arm/v7,linux/arm/v6,linux/386
          build-args: VERSION=${{ github.ref_name }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: false
          push: true
